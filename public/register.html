<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Reelhouse Cinema</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/common.js"></script>
  <script defer src="/js/auth.js"></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="auth-shell">
    <form id="auth-form" class="panel auth-card" novalidate>
      <p class="eyebrow">JOIN THE CLUB</p>
      <h1>Create account</h1>
      <p class="muted">A better movie night is just a few details away.</p>
      <div id="form-message" class="message" role="alert" aria-live="polite"></div>
      <label>Full name<input name="name" type="text" autocomplete="name" required minlength="2"></label>
      <label>Email address<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
      <label>Account type
        <select name="role" required>
          <option value="user">Moviegoer</option>
          <option value="organiser">Organiser</option>
        </select>
      </label>
      <button class="button button-primary button-wide" type="submit">Create account</button>
      <p class="form-footnote">Already have an account? <a href="/login.html">Sign in</a></p>
    </form>
  </main>
</body>
</html>
