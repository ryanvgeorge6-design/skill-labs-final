<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment · Reelhouse Cinema</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/common.js"></script>
  <script defer src="/js/payment.js"></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="page-shell narrow-shell">
    <header class="page-heading"><p class="eyebrow">ALMOST THERE</p><h1>Complete your booking</h1><p class="muted">Your seats are held while you complete checkout.</p></header>
    <section class="panel payment-panel">
      <div class="countdown-wrap"><span class="muted">Hold expires in</span><strong id="countdown">05:00</strong></div>
      <p id="payment-summary" class="payment-summary"></p>
      <div id="page-message" class="message" role="alert" aria-live="polite"></div>
      <form id="payment-form" novalidate>
        <label>Name on card<input name="cardholder" autocomplete="cc-name" required minlength="2"></label>
        <label>Card number<input name="cardNumber" inputmode="numeric" autocomplete="cc-number" required minlength="12" maxlength="23" pattern="[0-9 ]{12,23}" placeholder="4242 4242 4242 4242"></label>
        <div class="form-row">
          <label>Expiry<input name="expiry" autocomplete="cc-exp" required pattern="(0[1-9]|1[0-2])/[0-9]{2}" placeholder="MM/YY" maxlength="5"></label>
          <label>Security code<input name="cvc" inputmode="numeric" autocomplete="cc-csc" required pattern="[0-9]{3,4}" minlength="3" maxlength="4"></label>
        </div>
        <button id="pay-button" class="button button-primary button-wide" type="submit">Pay now</button>
        <button id="fail-button" class="button button-secondary button-wide" type="button">Simulate payment failure</button>
      </form>
      <section id="confirmation" class="confirmation" hidden></section>
    </section>
  </main>
</body>
</html>
